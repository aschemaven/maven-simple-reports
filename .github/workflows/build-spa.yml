name: Build SPA artifact

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/build-spa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_GITHUB_CLIENT_ID: ${{ vars.VITE_GITHUB_CLIENT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build SPA
        working-directory: ./web
        run: |
          npm ci
          npm run build

      - name: Upload SPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: spa-dist
          path: web/dist/
          retention-days: 90
          if-no-files-found: error
