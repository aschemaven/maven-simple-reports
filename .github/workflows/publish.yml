name: Publish

# Site build/deploy pipeline:
#
#   trigger             | SPA build          | deploy target
#   ----                | ---------          | -------------
#   push main           | cached (iff web/)  | GitHub Pages
#   push branch         | cached (iff web/)  | Netlify preview
#   pull_request        | cached (iff web/)  | Netlify preview
#   workflow_dispatch   | cached             | Pages (main) / Netlify (branch)
#
# The build-spa job always runs but restores web/dist from the Actions
# cache (key = hash of web/**); it only rebuilds on a cache miss (web/
# changed, or the cache was evicted). The Maven 4 adoption report is
# rendered from the registry on the data branch, which the Maven 4
# Registry workflow (registry.yml) keeps fresh — that workflow dispatches
# this one after each data change, so no cron is needed here.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write          # deploy to Pages
  id-token: write       # OIDC for actions/deploy-pages
  pull-requests: write  # Netlify bot PR comment
  actions: read         # artifact discovery via gh api

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Serialize per ref so two pushes to the same branch do not race; main
# deploys queue rather than cancel each other.
concurrency:
  group: publish-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  context:
    runs-on: ubuntu-latest
    outputs:
      deploy-target: ${{ steps.ctx.outputs.deploy-target }}
      is-main: ${{ steps.ctx.outputs.is-main }}
    steps:
      - name: Resolve deploy target
        id: ctx
        run: |
          set -e
          EVENT="${{ github.event_name }}"
          IS_MAIN=false
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            IS_MAIN=true
          fi

          # Decide where the run deploys.
          TARGET=none
          case "$EVENT" in
            push|workflow_dispatch)
              if [ "$IS_MAIN" = "true" ]; then
                TARGET=pages
              else
                TARGET=netlify
              fi
              ;;
            pull_request)
              TARGET=netlify
              ;;
          esac

          echo "is-main=$IS_MAIN" >> "$GITHUB_OUTPUT"
          echo "deploy-target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Resolved: target=$TARGET is-main=$IS_MAIN"

  build-spa:
    runs-on: ubuntu-latest
    env:
      VITE_GITHUB_CLIENT_ID: ${{ vars.VITE_GITHUB_CLIENT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # web/dist is a pure function of the web/ sources, so cache it keyed
      # by their content hash. A hit restores the built SPA in seconds and
      # the Node build below is skipped; a miss (web/ changed, or the cache
      # was evicted) rebuilds and repopulates the cache. Either way this
      # job always ends with a web/dist to upload as the spa-dist artifact,
      # so the publish jobs never need an artifact-retention fallback.
      - name: Restore SPA build cache
        id: spa-cache
        uses: actions/cache@v4
        with:
          path: web/dist
          key: spa-dist-${{ hashFiles('web/**') }}

      - name: Set up Node.js
        if: steps.spa-cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build SPA
        if: steps.spa-cache.outputs.cache-hit != 'true'
        working-directory: ./web
        run: |
          npm ci
          npm run build

      - name: Upload SPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: spa-dist
          path: web/dist/
          retention-days: 90
          if-no-files-found: error

  publish-pages:
    runs-on: ubuntu-latest
    needs: [context, build-spa]
    if: |
      always()
      && needs.context.outputs.deploy-target == 'pages'
      && needs.build-spa.result == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # build-spa always runs (cache-restore or rebuild), so this run's
      # spa-dist artifact is always present — no retention fallback needed.
      - name: Download SPA (from this run's build-spa)
        run: |
          mkdir -p public/dependabot-prs
          gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -n spa-dist -D public/dependabot-prs/
          echo "Deployed SPA from this run's build-spa job"

      - name: Restore Maven 4 registry from data branch
        run: |
          mkdir -p public data
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch origin data --depth=1
            git show FETCH_HEAD:maven4-registry.json > data/maven4-registry.json 2>/dev/null \
              && echo "Restored registry ($(wc -c < data/maven4-registry.json) bytes)" \
              || echo "::warning::No maven4-registry.json on data branch yet"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Render Maven 4 adoption report (HTML, from registry)
        run: |
          if [ -f data/maven4-registry.json ]; then
            python scripts/render_registry_report.py data/maven4-registry.json public/maven4-adoption.html
          else
            echo "::warning::No registry on data branch — Maven 4 report missing"
          fi

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install asciidoctor
        run: gem install asciidoctor

      - name: Render AsciiDoc to HTML
        run: |
          shopt -s nullglob
          for adoc_file in public/*.adoc; do
            html_file="${adoc_file%.adoc}.html"
            echo "  Converting $(basename "$adoc_file")..."
            asciidoctor -a docinfo=shared-footer -o "$html_file" "$adoc_file"
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  publish-netlify:
    runs-on: ubuntu-latest
    needs: [context, build-spa]
    if: |
      always()
      && needs.context.outputs.deploy-target == 'netlify'
      && needs.build-spa.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # build-spa always runs. Its cache key is hashFiles('web/**'), so a
      # preview whose web/ matches main restores main's cached SPA, while a
      # preview that changed web/ rebuilds its own — no run-walking needed.
      - name: Download SPA (from this run's build-spa)
        run: |
          mkdir -p public/dependabot-prs
          gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -n spa-dist -D public/dependabot-prs/
          echo "Deployed SPA from this run's build-spa job"

      - name: Restore Maven 4 registry from data branch
        run: |
          mkdir -p public data
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch origin data --depth=1
            git show FETCH_HEAD:maven4-registry.json > data/maven4-registry.json 2>/dev/null \
              && echo "Restored registry ($(wc -c < data/maven4-registry.json) bytes)" \
              || echo "::warning::No maven4-registry.json on data branch yet"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Render Maven 4 adoption report (HTML, from registry)
        run: |
          if [ -f data/maven4-registry.json ]; then
            python scripts/render_registry_report.py data/maven4-registry.json public/maven4-adoption.html
          else
            echo "::warning::No registry on data branch — Maven 4 report missing from this preview"
          fi

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install asciidoctor
        run: gem install asciidoctor

      - name: Render AsciiDoc to HTML
        run: |
          shopt -s nullglob
          for adoc_file in public/*.adoc; do
            html_file="${adoc_file%.adoc}.html"
            echo "  Converting $(basename "$adoc_file")..."
            asciidoctor -a docinfo=shared-footer -o "$html_file" "$adoc_file"
          done

      - name: Set Netlify alias
        id: netlify-alias
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "alias=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            BRANCH_NAME="${{ github.ref_name }}"
            SANITIZED=$(echo "$BRANCH_NAME" | sed 's/\//-/g')
            echo "alias=$SANITIZED" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Netlify Functions dependencies
        working-directory: ./netlify
        run: npm install --no-audit --no-fund

      - name: Deploy to Netlify
        id: netlify-deploy
        uses: nwtgck/actions-netlify@v2
        with:
          publish-dir: './public'
          functions-dir: './netlify/functions'
          production-deploy: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Preview from GitHub Actions - ${{ github.event.head_commit.message || github.event.pull_request.title }}"
          enable-pull-request-comment: true
          enable-commit-comment: false
          alias: ${{ steps.netlify-alias.outputs.alias }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Display Netlify URL
        run: |
          echo "### Netlify Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: ${{ steps.netlify-deploy.outputs.deploy-url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Alias: \`${{ steps.netlify-alias.outputs.alias }}\`" >> "$GITHUB_STEP_SUMMARY"
